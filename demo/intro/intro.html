<script>
  // Deterministic timeline: render(t) draws the frame at t seconds (0–2).
  // Voice timing comes from the URL: ?ls=<Lucien start>&ld=<dur>&ms=<Margaux start>&md=<dur>
  const q = new URLSearchParams(location.search);
  const T = {
    ls: parseFloat(q.get("ls") ?? "0.5"), ld: parseFloat(q.get("ld") ?? "0.6"),
    ms: parseFloat(q.get("ms") ?? "1.15"), md: parseFloat(q.get("md") ?? "0.4"),
  };
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  function mouth(t, start, dur, closedId, talkId) {
    const on = t >= start && t <= start + dur;
    $(closedId).style.opacity = on ? 0 : 1;
    $(talkId).style.opacity = on ? 1 : 0;
    if (on) {
      const k = (t - start) / dur;
      const open = 0.55 + 0.45 * Math.abs(Math.sin(k * Math.PI * Math.max(2, Math.round(dur * 6))));
      $(talkId).style.transform = `scale(1.08, ${0.4 + open * 1.25})`;
    }
  }

  window.render = function (t) {
    $("glow").style.opacity = easeOut(prog(t, 0, 0.45));
    // Arches light up, staggered
    for (const [arch, a] of [["archL", 0.0], ["archM", 0.1]]) {
      const p = easeOut(prog(t, a, a + 0.3));
      $(arch).style.opacity = p;
      $(arch).style.transform = `scale(${0.92 + 0.08 * p})`;
    }
    // Chefs pop up with a little overshoot
    for (const [chef, a] of [["lucien", 0.08], ["margaux", 0.18]]) {
      const p = easeBack(prog(t, a, a + 0.36));
      $(chef).style.transform = `translateY(${(1 - p) * 220}px)`;
    }
    // Lucien: eyebrow up as he speaks, settles at the end
    const browUp = easeOut(prog(t, T.ls - 0.1, T.ls + 0.12)) * (1 - easeOut(prog(t, 1.7, 1.95)));
    $("lBrow").style.transform = `translateY(${-11 * browUp}px) rotate(${-4 * browUp}deg)`;
    mouth(t, T.ls, T.ld, "lClosed", "lTalk");
    // Margaux: answers, then winks
    mouth(t, T.ms, T.md, "mClosed", "mTalk");
    const winkAt = T.ms + T.md + 0.04;
    const wink = t >= winkAt && t < winkAt + 0.55;
    $("mEyeOpen").style.opacity = wink ? 0 : 1;
    $("mWink").style.opacity = wink ? 1 : 0;
    const mb = easeOut(prog(t, winkAt - 0.05, winkAt + 0.1)) * (1 - easeOut(prog(t, winkAt + 0.5, winkAt + 0.7)));
    $("mBrow").style.transform = `translateY(${-8 * mb}px)`;
    // Wordmark and tagline
    const w = easeOut(prog(t, 0.95, 1.3));
    $("word").style.opacity = w;
    $("word").style.transform = `translateY(${(1 - w) * 34}px)`;
    const g = easeOut(prog(t, 1.25, 1.6));
    $("tag").style.opacity = g;
    $("tag").style.transform = `translateY(${(1 - g) * 18}px)`;
  };
  render(0);
</script>
